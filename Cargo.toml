[package]
name = "tree-sitter-expando"
description = "muttrc expando"
version = "0.0.1"
authors = ["Wu <wuzhenyu@ustc.edu>"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "expando"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/neomutt/tree-sitter-expando"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.8"
